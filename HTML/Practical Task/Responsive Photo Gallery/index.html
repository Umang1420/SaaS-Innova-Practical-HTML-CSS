<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h2>Responsive Photo Gallery</h2>
    <button onclick="location.reload()">Click Me!</button>
</header>

<div class="container">

    <div class="gallery">

        <div class="column">
            <img src="https://picsum.photos/300/220?random=1" alt="">
            <img src="https://picsum.photos/300/340?random=2" alt="">
            <img src="https://picsum.photos/300/180?random=3" alt="">
            <img src="https://picsum.photos/300/300?random=4" alt="">
            <img src="https://picsum.photos/300/250?random=5" alt="">
        </div>

        <div class="column">
            <img src="https://picsum.photos/300/320?random=6" alt="">
            <img src="https://picsum.photos/300/220?random=7" alt="">
            <img src="https://picsum.photos/300/280?random=8" alt="">
            <img src="https://picsum.photos/300/360?random=9" alt="">
            <img src="https://picsum.photos/300/200?random=10" alt="">
        </div>

        <div class="column">
            <img src="https://picsum.photos/300/260?random=11" alt="">
            <img src="https://picsum.photos/300/190?random=12" alt="">
            <img src="https://picsum.photos/300/330?random=13" alt="">
            <img src="https://picsum.photos/300/240?random=14" alt="">
            <img src="https://picsum.photos/300/300?random=15" alt="">
        </div>

    </div>

</div>

</body>
</html>
