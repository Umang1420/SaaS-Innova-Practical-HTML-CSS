<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h2>User Registration</h2>

        <form>

            <label>Full Name</label>
            <input type="text" placeholder="Enter Full Name" required minlength="3">

            <label>Email</label>
            <input type="email" placeholder="Enter Email" required>

            <label>Password</label>
            <input type="password" placeholder="Enter Password" required minlength="6">

            <label>Confirm Password</label>
            <input type="password" placeholder="Confirm Password" required minlength="6">

            <label>Mobile Number</label>
            <input type="tel" placeholder="Enter Mobile Number" pattern="[0-9]{10}" required>

            <label>Gender</label>

            <div class="gender">

                <label>
                    <input type="radio" name="gender" required>
                    Male
                </label>

                <label>
                    <input type="radio" name="gender">
                    Female
                </label>

            </div>

            <label>Date of Birth</label>
            <input type="date" required>

            <label>
                <input type="checkbox" required>
                I agree to the Terms and Conditions
            </label>

            <button type="submit">Register</button>

            <button type="reset">Reset</button>

        </form>

    </div>

</body>

</html>
