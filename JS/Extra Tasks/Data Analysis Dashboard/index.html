<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Analysis Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

    <h1>Product Data Analysis Dashboard</h1>

    <div id="dashboard">

        <div id="cards">

            <div class="card">
                <h3>Total Price</h3>
                <h2 id="sum">0</h2>
            </div>

            <div class="card">
                <h3>Average Price</h3>
                <h2 id="avg">0</h2>
            </div>

            <div class="card">
                <h3>Minimum Price</h3>
                <h2 id="min">0</h2>
            </div>

            <div class="card">
                <h3>Maximum Price</h3>
                <h2 id="max">0</h2>
            </div>

        </div>

        <div id="controls">

            <label>Filter By Category</label>

            <select id="category">

                <option>Loading...</option>

            </select>

            <button id="reset">Show All Products</button>

        </div>

        <div id="chartBox">

            <canvas id="chart"></canvas>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
