<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Text Analysis Tool</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1>Text Analysis Tool</h1>

    <textarea id="textInput" rows="8" placeholder="Paste or type your text here..."></textarea>
    <button id="analyzeBtn">Analyze</button>

    <div class="stats">
      <div class="stat-box">
        <p>Character Count</p>
        <h2 id="charCount">0</h2>
      </div>
      <div class="stat-box">
        <p>Word Count</p>
        <h2 id="wordCount">0</h2>
      </div>
      <div class="stat-box">
        <p>Average Word Length</p>
        <h2 id="avgLength">0</h2>
      </div>
    </div>

    <h3>Most Common Words</h3>
    <ol id="commonWords"></ol>

    <h3>Full Word Frequency</h3>
    <div id="frequencyTable"></div>
  </div>

<script src="script.js" defer></script>
</body>
</html>
