<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="content">
            <div id="box">
               <div class="play-card">
                 <div class="hedding">
                    <h1>Music Player</h1>
                    <p>Enjoy Music</p>
                </div>
                <div id="player">
                    <div id="img" class="img">
                    <p>Select The Song as your choice</p>
                    </div>
                    <div class="play-btns">
                        <button id="pre"><<</button>
                        <div id="audio"></div>
                        <button id="next">>></button>
                        
                    </div>
                </div>
                </div>
                <div class="playlist-card">
                    <div class="playlist">
                    <h2>Playlist</h2>
                    <div id="list">
                        
                    </div>
                </div>
                </div>
            </div> 
            <div class="songs">
                    <h3>Songs</h3>
                    <ol id="songlist"></ol>
                </div>
        </div>
    </div>
</body>
<script src="script.js" defer></script>
</html>
